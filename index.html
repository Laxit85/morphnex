<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <link rel="preload" href="/images/logo.webp" as="image" type="image/webp" fetchpriority="high" />

    <!-- Google Analytics (Lazy Loaded) -->
    <script>
      window.addEventListener('load', function() {
        var script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-N6EYXYQG9J';
        script.async = true;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-N6EYXYQG9J');
      });
    </script>

    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Morphnex Technologies | Web Development & IT Solutions</title>
    <link rel="canonical" href="https://morphnex.in/" />

    <meta
      name="description"
      content="Morphnex Technologies provides modern web development, software solutions, UI/UX design, and IT consulting services."
    />

    <meta
      name="keywords"
      content="web development, software solutions, IT consulting, React developer, Node.js, UI UX"
    />

    <meta name="author" content="Morphnex Technologies" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Morphnex Technologies" />
    <meta
      property="og:description"
      content="Modern web development and IT consulting solutions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://morphnex.in/" />
    <meta property="og:image" content="https://morphnex.in/images/preview.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Morphnex Technologies" />
    <meta
      name="twitter:description"
      content="Modern web development and IT consulting solutions."
    />
    <meta name="twitter:image" content="https://morphnex.in/images/preview.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/images/logo.jpeg" />

    <!-- Global Dynamic Import Recovery -->
    <script>
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        var reloaded = sessionStorage.getItem('morphnex_chunk_reload');
        if (!reloaded) {
          sessionStorage.setItem('morphnex_chunk_reload', 'true');
          window.location.reload(true);
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.indexOf('Failed to fetch dynamically imported module') !== -1 || event.message.indexOf('Importing a module script failed') !== -1)) {
          event.preventDefault();
          var reloaded = sessionStorage.getItem('morphnex_chunk_reload');
          if (!reloaded) {
            sessionStorage.setItem('morphnex_chunk_reload', 'true');
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
